<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Student Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2330;--mu:#667085;--ac:#3b5bdb;--bd:#d9dde7}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1e222d;--tx:#eceff5;--mu:#98a2b3;--ac:#7c96ff;--bd:#323848}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
input[type=text]{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:var(--bg);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer;margin-top:16px}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac);margin-right:8px}
button:disabled{opacity:.5}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-top:8px;cursor:pointer}
.opt input{accent-color:var(--ac);width:18px;height:18px}
.err{color:#d92d20;font-size:14px;margin-top:10px;min-height:20px}
.prev{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--bd);display:none;margin-top:10px}
.bar{height:6px;background:var(--bd);border-radius:6px;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px;width:50%}
.hide{display:none}
.tm{font-size:14px;color:var(--mu);margin-bottom:10px}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;pointer-events:none}
.wrap{transition:filter .1s}
body.shield .wrap{filter:blur(30px);visibility:hidden}
@media print{body{display:none!important}}
</style>
</head>
<body>
<div class="wrap">

<section id="p1">
  <div class="bar"><i></i></div>
  <h1>Student details</h1>
  <div class="card">
    <label for="name">Full name</label>
    <input type="text" id="name" autocomplete="name">
    <label for="roll">Roll number</label>
    <input type="text" id="roll">
    <label for="photo">Your photo</label>
    <input type="file" id="photo" accept="image/*">
    <img id="prev" class="prev" alt="Preview">
    <div class="err" id="e1"></div>
    <button id="next">Next →</button>
  </div>
</section>

<section id="p2" class="hide">
  <div class="bar"><i id="pbar" style="width:0"></i></div>
  <div class="tm">Time left: <b id="timer">30</b>s</div>
  <div id="qbox"></div>
  <div class="err" id="e2"></div>
  <button id="nextq">Next →</button>
  <button id="submit" class="hide">Try sending again</button>
</section>

<section id="done" class="hide">
  <div class="card"><h1>Submitted ✅</h1><p id="doneMsg"></p></div>
</section>

</div>
<script>
// ======== SETTINGS: fill these two ========
const BOT_TOKEN = "PASTE_BOT_TOKEN_HERE";   // from @BotFather
const CHAT_ID   = "PASTE_YOUR_CHAT_ID_HERE"; // your Telegram chat id
// ======== Questions (a = index of correct option, starting at 0) ========
const QUESTIONS=[
 {q:"What is the capital of India?",o:["Mumbai","New Delhi","Kolkata","Chennai"],a:1},
 {q:"Which planet is known as the Red Planet?",o:["Venus","Jupiter","Mars","Saturn"],a:2},
 {q:"What is 12 × 8?",o:["84","96","108","112"],a:1},
 {q:"Which gas do plants absorb from the air?",o:["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],a:2},
 {q:"Who wrote the national anthem of India?",o:["Bankim Chandra","Rabindranath Tagore","Sarojini Naidu","Premchand"],a:1}
];
// ========================================
const $=id=>document.getElementById(id);
let photoData="";

function show(id){["p1","p2","done"].forEach(s=>$(s).classList.toggle("hide",s!==id));window.scrollTo(0,0)}

const TIME_PER_Q=30; // seconds per question
let order=[],optOrder=[],picks=[],cur=0,tick=null,left=0,info={};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

$("photo").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{
    const m=900,k=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    photoData=c.toDataURL("image/jpeg",.8);
    $("prev").src=photoData;$("prev").style.display="block";$("e1").textContent="";
    URL.revokeObjectURL(url);
  };
  img.onerror=()=>{photoData="";$("prev").style.display="none";$("e1").textContent="Photo could not be read. Please choose a JPG or PNG image."};
  img.src=url;
});

$("next").onclick=()=>{
  if(!$("name").value.trim()||!$("roll").value.trim()||!photoData){$("e1").textContent="Please enter name, roll number and upload a photo.";return}
  $("e1").textContent="";
  info={name:$("name").value.trim(),roll:$("roll").value.trim()};
  order=shuffle(QUESTIONS.map((_,i)=>i));
  optOrder=QUESTIONS.map(q=>shuffle(q.o.map((_,j)=>j)));
  picks=QUESTIONS.map(()=>-1);cur=0;
  show("p2");showQ();
};

function showQ(){
  const qi=order[cur],x=QUESTIONS[qi];
  $("qbox").textContent="";$("e2").textContent="";
  const d=document.createElement("div");d.className="card";
  const h=document.createElement("h2");h.textContent="Question "+(cur+1)+" of "+order.length+": "+x.q;d.appendChild(h);
  optOrder[qi].forEach(j=>{
    const l=document.createElement("label");l.className="opt";
    const r=document.createElement("input");r.type="radio";r.name="q";r.value=j;
    const s=document.createElement("span");s.textContent=x.o[j];
    l.append(r,s);d.appendChild(l);
  });
  $("qbox").appendChild(d);
  $("pbar").style.width=(cur/order.length*100)+"%";
  $("nextq").textContent=cur===order.length-1?"Finish":"Next →";
  clearInterval(tick);left=TIME_PER_Q;$("timer").textContent=left;
  tick=setInterval(()=>{left--;$("timer").textContent=left;if(left<=0)goNext(true)},1000);
}

function goNext(auto){
  const c=document.querySelector('input[name=q]:checked');
  if(!c&&!auto){$("e2").textContent="Choose an answer, or wait for the timer.";return}
  clearInterval(tick);
  picks[order[cur]]=c?+c.value:-1;
  cur++;
  if(cur<order.length)showQ();else finish();
}
$("nextq").onclick=()=>goNext(false);

async function finish(){
  $("qbox").textContent="";$("nextq").classList.add("hide");$("pbar").style.width="100%";$("timer").textContent="0";
  send();
}

async function send(){
  const score=picks.reduce((s,a,i)=>s+(a===QUESTIONS[i].a?1:0),0);
  const caption=["📝 New submission","Name: "+info.name,"Roll no: "+info.roll,"Score: "+score+"/"+QUESTIONS.length,""]
    .concat(picks.map((a,i)=>"Q"+(i+1)+": "+(a<0?"No answer ❌":QUESTIONS[i].o[a]+(a===QUESTIONS[i].a?" ✅":" ❌")))).join("\n");
  $("submit").classList.add("hide");$("e2").textContent="Sending...";
  try{
    const blob=await (await fetch(photoData)).blob();
    const fd=new FormData();
    fd.append("chat_id",CHAT_ID);
    fd.append("caption",caption.slice(0,1000));
    fd.append("photo",blob,"photo.jpg");
    const res=await fetch("https://api.telegram.org/bot"+BOT_TOKEN+"/sendPhoto",{method:"POST",body:fd});
    const j=await res.json();
    if(!j.ok)throw new Error(j.description||"Telegram error");
    $("doneMsg").textContent="Thank you, "+info.name+". Your answers have been sent. Score: "+score+"/"+QUESTIONS.length;
    show("done");
  }catch(err){$("e2").textContent="Could not send: "+(err.message||"try again");$("submit").classList.remove("hide")}
}
$("submit").onclick=send;

// ---- Screenshot deterrents (cannot fully block screenshots in a browser) ----
const shield=on=>document.body.classList.toggle("shield",on);
document.addEventListener("contextmenu",e=>e.preventDefault());
["copy","cut","dragstart","selectstart"].forEach(t=>document.addEventListener(t,e=>{if(!(e.target&&e.target.tagName==="INPUT"))e.preventDefault()}));
document.addEventListener("keydown",e=>{
  const k=(e.key||"").toLowerCase();
  const snip=k==="printscreen"||k==="meta"&&false||(e.metaKey&&e.shiftKey&&["3","4","5","s"].includes(k))||(e.ctrlKey&&["p","s","u"].includes(k))||k==="f12";
  if(snip){e.preventDefault();shield(true);try{navigator.clipboard.writeText("Screenshots are not allowed")}catch(x){}setTimeout(()=>shield(false),1500)}
});
document.addEventListener("keyup",e=>{if((e.key||"").toLowerCase()==="printscreen"){try{navigator.clipboard.writeText("Screenshots are not allowed")}catch(x){}shield(true);setTimeout(()=>shield(false),1500)}});
document.addEventListener("visibilitychange",()=>shield(document.hidden));
window.addEventListener("blur",()=>shield(true));
window.addEventListener("focus",()=>shield(false));
</script>
</body>
</html>
